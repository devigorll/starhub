<!doctype html><html lang="pt-BR" data-theme="light" data-accent="blue"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" href="/img/logo-96.png"><title>StarHub · Entrar</title>
<link rel="stylesheet" href="/css/style.css">
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem('sh-theme')||'light';d.dataset.accent=localStorage.getItem('sh-accent')||'blue'}catch(e){}</script></head>
<body><canvas id="space" aria-hidden="true"></canvas><button class="btn corner" id="theme"></button>
<main class="login"><form id="f"><div class="login-brand"><img src="/img/logo-256.png" width="76" height="76" alt="StarHub"><h1>StarHub</h1></div>
<label>E-mail<input type="email" name="email" autocomplete="username" required></label>
<label>Senha<input type="password" name="password" autocomplete="current-password" required></label>
<p class="err" id="err" role="alert"></p><button class="btn primary" style="justify-content:center">Entrar</button></form></main>
<div id="toast"></div>
<script type="module">
import {icon,initTheme,stars,api} from '/js/core.js';
initTheme(theme);stars();
f.onsubmit=async e=>{e.preventDefault();err.textContent='';
 try{await api('/login',{method:'POST',body:Object.fromEntries(new FormData(f))});location.href='/app'}catch(x){err.textContent=x.message}};
</script></body></html>
