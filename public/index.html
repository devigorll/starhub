<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>StarHub</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sh-theme')||'light'}catch(e){}</script></head>
<body><div id="space"></div>
<header><div class="brand" id="brand"></div><div class="actions">
<button class="btn" id="theme"></button><button class="btn" id="out"></button></div></header>
<main><div class="top"><div><h1>Meus projetos</h1><p id="count"></p></div><button class="btn primary" id="add"></button></div>
<div class="grid" id="grid"></div></main>
<dialog id="dlg"><form class="m" id="form" method="dialog"><h2 id="dt"></h2>
<label>Nome<input name="name" maxlength="80" required></label>
<label>Descrição (opcional)<textarea name="description" rows="2" maxlength="300"></textarea></label>
<div><span style="color:var(--muted);font-size:.9rem">Páginas</span><div id="rows" style="display:grid;gap:.5rem;margin-top:.4rem"></div>
<button type="button" class="btn" id="addrow" style="margin-top:.6rem"></button></div>
<p class="err" id="ferr" role="alert"></p>
<div class="end"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar projeto</button></div></form></dialog>
<dialog id="conf"><form class="m" method="dialog"><h2>Excluir projeto?</h2><p id="cm" style="margin:0;color:var(--muted)"></p>
<div class="end"><button value="no" class="btn">Cancelar</button><button value="yes" class="btn danger">Excluir</button></div></form></dialog>
<div id="toast"></div><script type="module" src="/js/app.js"></script></body></html>
