<!doctype html><html lang="pt-BR" data-theme="light" data-accent="blue"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StarHub</title>
<link rel="icon" type="image/png" href="/img/logo-96.png"><link rel="apple-touch-icon" href="/img/logo-256.png">
<link rel="stylesheet" href="/css/style.css">
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem('sh-theme')||'light';d.dataset.accent=localStorage.getItem('sh-accent')||'blue'}catch(e){}</script></head>
<body><canvas id="space" aria-hidden="true"></canvas>
<header><a class="brand" href="/app"><img src="/img/logo-96.png" width="34" height="34" alt=""><span>StarHub</span></a>
<div class="actions"><button class="btn icon-btn" id="theme"></button><button class="btn icon-btn" id="menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer"></button></div></header>
<main><div class="top"><div><h1>Projetos</h1><p id="count"></p></div><button class="btn primary fab" id="add"></button><button class="btn primary fab" id="done" hidden></button></div>
<div class="grid" id="grid"></div></main>
<div id="scrim"></div>
<aside id="drawer" aria-label="Menu"><div class="d-head"><h2>Menu</h2><button class="btn icon-btn" id="close" aria-label="Fechar menu"></button></div>
<h3 class="d-title">Cor de destaque</h3><div class="swatches" id="sw" role="group" aria-label="Cor de destaque"></div>
<button class="item" id="reset"></button><div class="d-sep"></div><button class="item" id="org"></button>
<div class="d-foot"><div class="d-sep"></div><button class="item danger" id="out"></button></div></aside>
<dialog id="dlg"><form class="m" id="form" method="dialog"><h2 id="dt"></h2>
<label>Nome<input name="name" maxlength="80" required></label>
<label>Descrição (opcional)<textarea name="description" rows="2" maxlength="300"></textarea></label>
<div><span style="color:var(--muted);font-size:.88rem">Páginas</span><div id="rows" style="display:grid;gap:.6rem;margin-top:.4rem"></div>
<button type="button" class="btn" id="addrow" style="margin-top:.7rem"></button></div>
<p class="err" id="ferr" role="alert"></p>
<div class="end"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar projeto</button></div></form></dialog>
<dialog id="conf"><form class="m" method="dialog"><h2>Excluir projeto?</h2><p id="cm" style="margin:0;color:var(--muted)"></p>
<div class="end"><button value="no" class="btn">Cancelar</button><button value="yes" class="btn danger">Excluir</button></div></form></dialog>
<div id="toast"></div><script type="module" src="/js/app.js"></script></body></html>
